<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Rounded Background Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Document Sheet with Folded Corner -->
  <g transform="translate(106, 86)">
    <!-- Main Body Paper -->
    <path d="M 40 0 L 210 0 L 300 90 L 300 340 C 300 356.5 286.5 370 270 370 L 40 370 C 23.5 370 10 356.5 10 340 L 10 30 C 10 13.5 23.5 0 40 0 Z" fill="#FFFFFF" />

    <!-- Folded Top-Right Corner -->
    <path d="M 210 0 L 210 70 C 210 81 219 90 230 90 L 300 90 Z" fill="#CBD5E1" />

    <!-- Document Content Lines -->
    <rect x="54" y="130" width="140" height="22" rx="11" fill="#2563EB" />
    <rect x="54" y="176" width="192" height="18" rx="9" fill="#94A3B8" />
    <rect x="54" y="214" width="192" height="18" rx="9" fill="#CBD5E1" />
    <rect x="54" y="252" width="130" height="18" rx="9" fill="#CBD5E1" />

    <!-- Linked Chain Accent Circle Badge -->
    <circle cx="230" cy="290" r="32" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="8" />
  </g>
</svg>
