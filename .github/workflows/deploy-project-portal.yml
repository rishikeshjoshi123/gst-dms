name: Deploy Project Portal

on:
  push:
    branches:
      - dev
    paths:
      - 'docs/plans/**'
      - 'docs/project-portal-status.json'
      - 'project-portal/**'
      - 'scripts/build-project-portal.mjs'
      - '.github/workflows/deploy-project-portal.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the static portal
        run: node scripts/build-project-portal.mjs
        env:
          PORTAL_SOURCE_BRANCH: ${{ github.ref_name }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: project-portal/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
